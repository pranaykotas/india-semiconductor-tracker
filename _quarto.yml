project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!CLAUDE.md"

website:
  title: "India Semiconductor Tracker"
  description: "Tracking semiconductor facilities and chip design across India"
  favicon: "images/favicon.svg"
  site-url: "https://fabs.pranaykotas.com"

  navbar:
    background: "#620d3c"
    foreground: "#ffffff"
    left:
      - text: "Map & Overview"
        href: index.qmd
      - text: "Timeline"
        href: timeline.qmd
      - text: "Technology Nodes"
        href: nodes.qmd
      - text: "Chip Design"
        href: design.qmd
      - text: "Policy & Budget"
        href: budget.qmd
      - text: "About"
        href: about.qmd
    right:
      - text: "Takshashila"
        href: https://takshashila.org.in
        aria-label: "Takshashila Institution"
      - icon: github
        href: https://github.com/pranaykotas/india-semiconductor-tracker
        aria-label: "GitHub repository"

  page-footer:
    left: |
      &copy; 2026 [Pranay Kotasthane](https://pranaykotas.com) · [Takshashila Institution](https://takshashila.org.in)
    center: |
      Part of the [Siliconpolitik Project](https://takshashila.org.in/pages/research-areas/focus-areas/siliconpolitik.html) · [Subscribe for monthly updates](https://hightechir.substack.com/s/siliconpolitik)
    right: |
      [Submit an update](https://github.com/pranaykotas/india-semiconductor-tracker/issues/new/choose)

  search: true

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    toc: true
    toc-depth: 2
    mainfont: "Inter"
    monofont: "Roboto Mono"
