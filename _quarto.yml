project:
  type: website
  output-dir: _site
  # Copy static files (e.g. slide decks embedded on analysis.qmd) into _site/
  resources:
    - "assets/*"
  # Stamp the footer with the date the data last changed (writes _variables.yml)
  pre-render: Rscript R/write_data_date.R
  render:
    - "*.qmd"
    - "!CLAUDE.md"

website:
  title: "India Semiconductor Tracker"
  description: "Tracking semiconductor facilities and chip design across India"
  favicon: "images/favicon.svg"
  site-url: "https://fabs.pranaykotas.com"

  navbar:
    background: "#620d3c"
    foreground: "#ffffff"
    left:
      - text: "Map & Overview"
        href: index.qmd
      - text: "Trackers"
        menu:
          - text: "Timeline"
            href: timeline.qmd
          - text: "Technology Nodes"
            href: nodes.qmd
          - text: "Chip Design"
            href: design.qmd
          - text: "Equipment & Materials"
            href: equipment.qmd
      - text: "Policy & Budget"
        menu:
          - text: "Budget & Schemes"
            href: budget.qmd
          - text: "Analysis & Writing"
            href: analysis.qmd
          - text: "What to Watch"
            href: watch.qmd
      - text: "About"
        href: about.qmd
    right:
      - text: "Takshashila"
        href: https://takshashila.org.in
        aria-label: "Takshashila Institution"
      - icon: github
        href: https://github.com/pranaykotas/india-semiconductor-tracker
        aria-label: "GitHub repository"

  page-footer:
    left: |
      &copy; 2026 [Pranay Kotasthane](https://pranaykotas.com) · [Takshashila Institution](https://takshashila.org.in)<br>Data last updated: {{< var data_updated >}}
    center: |
      Part of the [Siliconpolitik Project](https://takshashila.org.in/pages/research-areas/focus-areas/siliconpolitik.html) · [Subscribe for monthly updates](https://hightechir.substack.com/s/siliconpolitik)
    right: |
      [Submit an update](https://github.com/pranaykotas/india-semiconductor-tracker/issues/new/choose)

  search: true

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    toc: true
    toc-depth: 2
    mainfont: "Inter"
    monofont: "Roboto Mono"
