  - id: micron-sanand
    name: "Micron ATMP Facility"
    company: "Micron Technology"
    category: "Commercial (ISM Approved)"
    location:
      city: "Sanand"
      state: "Gujarat"
      lat: 22.992
      lon: 72.371
    type: "Assembly & Packaging"
    capability: "Advanced Memory Packaging (DRAM & NAND)"
    investment:
      total_inr: 22516
    status: "Operational"
    narrative:
      significance: "India's first operational semiconductor facility. Proved that a global chipmaker would bet on India."
      what_it_makes: "Packages DRAM and NAND flash memory chips — the memory inside your phone, laptop, and data centre servers. Raw silicon wafers arrive from Micron's fabs abroad and are assembled, tested, and packaged here."
      why_it_matters: "Memory packaging is the least complex part of chipmaking, but Micron choosing India over other Asian countries was a watershed moment. It signalled to the global industry that India is a credible semiconductor destination. The facility also anchors a cluster of semiconductor units in Sanand, Gujarat."
    milestones:
      - date: "2023-06-22"
        event: "Announced during PM Modi's US state visit; Micron CEO Sanjay Mehrotra commits Rs.22,516 crore"
