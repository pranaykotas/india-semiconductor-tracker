  - id: tata-psmc-dholera
    name: "Tata Electronics Semiconductor Fab"
    company: "Tata Electronics (TEPL)"
    category: "Commercial (ISM Approved)"
    partners: ["Powerchip Semiconductor Manufacturing Corp (PSMC), Taiwan"]
    location:
      city: "Dholera"
      state: "Gujarat"
      lat: 22.248
      lon: 72.189
    type: "Fab"
    capability: "28nm-55nm Logic (50,000 Wafers/Month)"
    investment:
      total_inr: 91000
    status: "Under Construction"
    status_detail: "Behind schedule — no revised completion date announced yet"
    delay_confirmed: true
    narrative:
      significance: "India's first commercial semiconductor fabrication plant. The most ambitious and complex project in the ISM portfolio."
      what_it_makes: "Will fabricate silicon wafers at 28nm-55nm process nodes — the chips inside cars, IoT devices, industrial equipment, and telecom infrastructure. These are mature-node chips that India currently imports in massive quantities."
      why_it_matters: "This is the project that will determine whether India can actually make chips, not just package them. A fab is orders of magnitude more complex than an assembly plant. Tata's partnership with Taiwan's PSMC brings process technology know-how, but building and operating a fab requires mastering thousands of manufacturing steps. If Dholera succeeds, it fundamentally changes India's position in the global semiconductor supply chain."
    milestones:
      - date: "2024-02-29"
        event: "Union Cabinet approves Tata-PSMC fab under the Modified Semiconductor Fab Scheme"
      - date: "2024-03-13"
        event: "PM Modi lays foundation stone at Dholera Special Investment Region"
      - date: "2024-03-13"
        event: "Construction begins — site preparation and civil works"
    complexity:
      technology_difficulty: 2
      foreign_dependence: 3
      capital_intensity: 4
    dates:
      announced: "2024-02-29"
      approved: "2024-02-29"
      construction_start: "2024-03-13"
      original_expected_completion: "2026-12-31"
      original_completion_source:
        url: "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2012209"
        title: "PIB: PM lays foundation stone (March 2024)"
        date: "2024-03-13"
    oecd_taxonomy:
      plant_information:
        owner: "Tata Electronics Private Limited (India); technology partner: Powerchip Semiconductor Manufacturing Corp (PSMC), Taiwan"
        start_year: "2026 (expected first wafers; construction began March 2024)"
        business_model: "Foundry"
      capability:
        chip_type: "Logic"
        detailed_chip_type: "Info not available (foundry; depends on customer orders — likely MCU, microcontroller, power management, SoC)"
        feature_size: "28nm – 55nm"
        wafer_size: "Info not available"
        transistor_type: "Planar MOSFET with High-K/Metal Gate (HKMG); 28nm is a pre-FinFET node"
        process_technologies: "DUV (Deep Ultraviolet) lithography; High-K dielectrics; Metal gate"
        semiconductor_material: "Silicon (Si)"
      capacity:
        wafer_starts_per_month: "~50,000 wspm (target)"
        cleanroom_size: "Info not available"
