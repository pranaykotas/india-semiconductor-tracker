      lon: 85.825
    type: "Compound Semiconductor"
    capability: "SiC Power Devices (60k wafers/year)"
    investment:
      total_inr: 2066
    status: "Approved"
    narrative:
      significance: "India's first commercial Silicon Carbide fab. A critical technology for defence, EVs, and power infrastructure."
      what_it_makes: "Fabricates Silicon Carbide (SiC) semiconductor devices — power chips that can handle extreme heat (2,400°C) and high voltages. Used in electric vehicle inverters, missile systems, radar, space electronics, and power grid equipment."
      why_it_matters: "SiC is a compound semiconductor — fundamentally different from the silicon chips made at Tata-PSMC. It is a niche but strategically vital technology. India currently imports all SiC devices. Having a domestic fab reduces vulnerability in defence supply chains and positions India in the fast-growing EV power electronics market."
    milestones:
