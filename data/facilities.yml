      announced: "2023-06-22"
      approved: "2023-06-22"
      construction_start: "2024-09-01"
      original_expected_completion: "2025-06-30"
      date_completion: "2026-02-26"
    sources:
      - url: "https://www.pib.gov.in/PressReleaseDetail.aspx?PRID=2233998&reg=3&lang=1"
        title: "PIB: Micron begins volume production at India facility"
