      - date: "2024-09-01"
        event: "Construction begins at Sanand GIDC"
      - date: "2025-09-23"
        event: "Facility inaugurated — India's first semiconductor assembly and test unit goes live"
      - date: "2026-02-26"
        event: "Volume production begins — chips rolling off the line at commercial scale"
    complexity:
      technology_difficulty: 1
      foreign_dependence: 2
      capital_intensity: 3
