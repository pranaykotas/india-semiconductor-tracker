    significance: 'One group, three names: Bharat Semi (founded late 2021), its design division 3rdiTech (IIT Delhi-linked;
      iDEX winner; co-founder Dr Mukul Sarkar), and DV2JS Innovation LLP (incorporated January 2018), the entity on the official
      PDLI list. All share partners Vrinda Kapoor and Vinayak Dalmia. Raised a $24M all-equity seed round in November 2026
      (Info Edge, South Park Commons, Indusbridge Ventures; Micromax, Valour Capital, Gaingels). About 75 staff across New
      Delhi, Bengaluru and Santa Clara; CTO Boyd Fowler was previously CTO at OmniVision. Design wins with General Atomics
      and Kaynes Semicon; 3rdiTech signed a vision-systems MoU with Kaynes Semicon and SPARSHIQ (Sept 2025). A separate fab
      project announced in 2024 with a US Space Force technology partnership remains in development and is not funded by the
      seed round. The group link is inferred from shared partners and press descriptions; no single page states all three
      relationships.'
