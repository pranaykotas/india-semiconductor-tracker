  narrative:
    significance: IISc Bengaluru spin-off (CEO Hareesh Chandrasekar, co-founder Srinivasan Raghavan) built on over 15 years
      of GaN research at IISc. Not strictly fabless; it owns the whole GaN chain from epitaxial wafers to devices, which are
      made at IISc's MeitY-funded GaN Ecosystem Enabling Centre and Incubator (GEECI), housed in CeNSE (see the facility page). Raised a $3.5 million seed round
      (3one4 Capital, Zephyr Peacock) in October 2024 and a $2.6 million extension (Shastra VC) in March 2026. It runs
      customer pilots, has begun pilot wafer exports, holds an iDEX contract for GaN wireless transmitters, and targets
      1 lakh chips a year; it has also said it wants a GaN factory under Semicon 2.0.
    what_it_designs: GaN-on-silicon/SiC epitaxial wafers, RF transistors and power devices for defence radar and
      communications, telecom base stations and power electronics.
