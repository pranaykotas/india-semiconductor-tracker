    lon: 77.594
  investment:
    total_inr: 3600
    total_usd_million: 5000
  status: "Announced"
  supplies_to: []
  narrative:
    significance: "Applied Materials' largest India commitment to date — a 140-acre advanced semiconductor research park combining cleanroom capability, R&D, and a 10x expansion of India-based supply-chain capacity. Reported from two angles a day apart: Karnataka's government framed it as a ₹3,600cr/1,000-job state deal (16 Sept 2026); the company's own 'India Vision 2035' framing the next day put it at $5B over a decade. Same location, same 10-year timeframe, same focus (R&D + equipment manufacturing) — near-certainly one commitment described at state vs. global level, not two additive investments. Both figures are given here since neither source explicitly reconciles them."
    what_it_supplies: "Semiconductor process equipment R&D, engineering design, and manufacturing/testing of chip-making tools; collaborative R&D space for customers and suppliers on one site."
  milestones:
    - date: "2026-09-16"
      event: "Karnataka government announces ₹3,600cr Applied Materials investment in Bengaluru Signature Business Park (R&D, equipment manufacturing, software), ~1,000 jobs"
    - date: "2026-09-17"
      event: "Applied Materials announces 'India Vision 2035' — $5B over a decade, 140-acre research park, 10x supply-chain expansion — at SEMICON India 2026"
  sources:
    - url: "https://www.communicationstoday.co.in/applied-materials-to-invest-%E2%82%B93600-crore-in-karnataka/"
      title: "Applied Materials to invest ₹3,600 crore in Karnataka"
      date: "2026-09-16"
    - url: "https://www.newsbytesapp.com/news/business/applied-materials-unveils-5-billion-india-vision-2035-investment-plan/tldr"
      title: "Applied Materials unveils $5 billion India Vision 2035 investment plan"
      date: "2026-09-17"

