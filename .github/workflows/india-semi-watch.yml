name: India Semi Watch monthly draft

on:
  schedule:
    # 1st of every month at 00:30 UTC = 06:00 IST
    - cron: '30 0 1 * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  draft:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic pyyaml requests markdown

      - name: Generate draft
        run: python scripts/india_semi_watch.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Extract subject line
        id: subject
        run: echo "subject=$(head -1 data/india-semi-watch.txt)" >> $GITHUB_OUTPUT

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.subject.outputs.subject }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: ${{ secrets.SMTP_USERNAME }}
          html_body: file://data/india-semi-watch.html
