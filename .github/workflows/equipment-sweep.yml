name: Quarterly equipment & materials sweep

on:
  schedule:
    # 1st of Jan, Apr, Jul, Oct at 02:30 UTC = 08:00 IST (offset from the
    # design-firm sweep so the two Claude calls don't race)
    - cron: '30 2 1 1,4,7,10 *'
    # Post-Semicon India catch-up — same rationale as design-sweep.yml.
    - cron: '30 2 25 9 *'
  workflow_dispatch: # Allow manual trigger

jobs:
  sweep:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic pyyaml requests markdown

      - name: Run equipment & materials sweep
        run: python scripts/equipment_sweep.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Extract subject line
        id: subject
        run: echo "subject=$(head -1 data/equipment-sweep.txt)" >> $GITHUB_OUTPUT

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.subject.outputs.subject }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: ${{ secrets.SMTP_USERNAME }}
          html_body: file://data/equipment-sweep.html
