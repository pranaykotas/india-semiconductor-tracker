name: Monthly design firm sweep

on:
  schedule:
    # 1st of every month at 02:00 UTC = 07:30 IST (was quarterly until Nov 2026)
    - cron: '0 2 1 * *'
    # Post-Semicon India catch-up: the flagship event runs each September
    # and reliably generates a cluster of MoUs/launches the quarterly
    # cadence alone could miss for weeks. Fixed date is an approximation —
    # adjust if the event's actual dates shift in a given year.
    - cron: '0 2 25 9 *'
  workflow_dispatch: # Allow manual trigger

jobs:
  sweep:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic pyyaml requests markdown

      - name: Run design sweep
        run: python scripts/design_sweep.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Extract subject line
        id: subject
        run: echo "subject=$(head -1 data/design-sweep.txt)" >> $GITHUB_OUTPUT

      - name: Send email
        uses: dawidd6/action-send-mail@v24
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.subject.outputs.subject }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: ${{ secrets.SMTP_USERNAME }}
          html_body: file://data/design-sweep.html
