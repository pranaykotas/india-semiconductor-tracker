name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Weekly rebuild every Monday at 06:00 UTC (11:30 IST)
    # Keeps slippage badges and "Recent Developments" fresh
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::yaml
            any::dplyr
            any::tidyr
            any::leaflet
            any::DT
            any::ggplot2
            any::scales
            any::glue
            any::htmltools
            any::sf
            any::rnaturalearth
            any::ragg

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Generate facility pages
        run: Rscript R/generate_facility_pages.R

      - name: Render site
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
