name: Weekly semiconductor digest

on:
  schedule:
    # Every Monday at 01:30 UTC = 07:00 IST
    # Runs after the weekly site rebuild (06:00 UTC) so YAML is always fresh
    - cron: '30 1 * * 1'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate digest
        run: python scripts/weekly_digest.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Extract subject line
        id: subject
        run: echo "subject=$(head -1 data/digest.txt)" >> $GITHUB_OUTPUT

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.subject.outputs.subject }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: ${{ secrets.SMTP_USERNAME }}
          body: file://data/digest.txt
